; NV SMP Physics settings. Everything here is also in the in-game menu (F7), which applies changes
; immediately; "Save to INI" there writes this file.
[Main]
; Physics on or off. Off, every item follows its animated pose.
bEnabled=1
; Actors farther than this keep their physics but without collision (the expensive part). The player always collides.
fCollisionDistance=1500
; Most actors with collision at once, nearest first; the others keep their physics without collision.
iMaxActors=10
; The physics step rate (FSMP's min-fps): the simulation runs in fixed steps of 1/iMinFps seconds. Higher is smoother and costs more.
iMinFps=180
; A frame longer than this many 60 Hz frames (4 = 1/15 s) drops the rest instead of catching up.
iMaxSubSteps=4
; Constraint solver iterations. Higher is stiffer and costs more.
iSolverIterations=10
; Collision threads on or off (experimental: one unexplained freeze on loading a save was seen with them on). Off, the
; collision tests all run on the physics thread.
bCollisionThreads=0
; Extra threads the collision tests are spread over (the physics thread works too). -1 = auto, 0 = all on the physics thread.
iCollisionThreads=-1
; The simulation steps on a thread of its own while the game draws, instead of holding up the frame (1). The cloth answers the body a frame later.
bAsyncStep=1
; Gravity, 1 = Earth's.
fGravityScale=1
; Turning faster than fResetAngle per second starts the physics over in its rest pose, as a teleport does.
bUnclampedResets=1
fResetAngle=120
; The weather's wind, as the grass and trees get it.
bWind=1
; Wind strength at the windiest weather, compared with 9.8 for gravity (FSMP's wind strength).
fWindStrength=2
bWindInInteriors=0
; Collision on (off lets the cloth pass through the body; for finding what pushes it).
bCollisions=1
; Collision tests on a frame's first physics step only; its other steps reuse those contacts. Cheaper, the more steps a frame has.
bCollideOncePerFrame=0
; A ground plane at the actor's feet the cloth rests on, instead of sinking through it when crouching or sitting.
bGround=1
; Smooths the small fast shaking of the cloth (what is drawn, not the physics).
bJitterFilter=1
; 0 = light, follows every twitch. 1 = strong: still cloth is rock steady, and settles a little slowly after a move.
fJitterSmoothing=0.5
; The menu key (a Windows virtual-key code; 0x76 = F7).
iMenuKey=0x76
; Log detail in NVSMPPhysics.log (game folder): 0 everything .. 4 errors only.
iLogLevel=2
